name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Desktop lint
        run: npm run lint

      - name: Desktop typecheck
        run: npm run typecheck

      - name: Desktop tests
        run: npm run test

      - name: Desktop web build
        run: npm run build

  subscription-editor-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subscription-editor-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/subscription-editor-web/package-lock.json

      - name: Install editor web dependencies
        run: npm ci

      - name: Editor web lint
        run: npm run lint

      - name: Editor web typecheck
        run: npm run typecheck

      - name: Editor web tests
        run: npm run test

      - name: Editor web build
        run: npm run build

  result-share-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/result-share-web
    steps:
