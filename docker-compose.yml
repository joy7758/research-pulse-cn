services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-pulse-cn-api
    env_file:
      - .env
    command: uvicorn research_pulse_cn.main:app --factory --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-pulse-cn-worker
    env_file:
      - .env
    command: python -m research_pulse_cn.worker.main --limit 20 --poll-interval 15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-pulse-cn-scheduler
    env_file:
      - .env
    command: python -m research_pulse_cn.scheduler.main --poll-interval 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: research-pulse-cn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_pulse_cn}
      POSTGRES_USER: ${POSTGRES_USER:-research_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_pulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_pulse} -d ${POSTGRES_DB:-research_pulse_cn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: research-pulse-cn-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
